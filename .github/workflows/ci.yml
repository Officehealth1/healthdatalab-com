name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # The JS and MJS runners need only Node itself; 24 is Netlify's default on its current build image.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: PHP syntax, every file under hdl-longevity-v2/
        shell: bash
        run: |
          find hdl-longevity-v2 -name '*.php' -print0 | while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; exit 1; }
          done
      - name: Every test-* and scenario-* runner under tests/, from the plugin root
        working-directory: hdl-longevity-v2
        shell: bash
        run: |
          n=0; failed=0
          while IFS= read -r f; do
            n=$((n + 1))
            case "$f" in *.php) run=php ;; *) run=node ;; esac
            if ! $run "$f" > "$RUNNER_TEMP/runner.log" 2>&1 < /dev/null; then
              failed=$((failed + 1)); echo "::error file=hdl-longevity-v2/$f::runner failed"; tail -40 "$RUNNER_TEMP/runner.log"
            fi
          done < <(find tests -type f \( -name 'test-*' -o -name 'scenario-*' \) \( -name '*.php' -o -name '*.js' -o -name '*.mjs' \) | sort)
          echo "$((n - failed)) of $n runners green"
          [ "$failed" -eq 0 ]

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, as published in the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the whole history
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          (cd "$RUNNER_TEMP" && echo "${GITLEAKS_SHA256}  $f" | sha256sum -c - && tar -xzf "$f" gitleaks)
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" .

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.164.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/secrets --config p/owasp-top-ten --config p/php --metrics=off --error
