<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage 1 result, one column: a page to look at (nothing is sent)</title>
<style>body{margin:0;padding:24px 16px;background:#f7f5f1;}</style>
</head>
<body>
<!--
  Plan 19 (hdlv2_ff_stage1_result_one_column). The REAL widget file, with every request answered on this
  page: no server, no lead, no e-mail. Serve hdl-longevity-v2/ over http and open
    tests/result-one-column/harness.html?layout=1
  then, in the console:  document.querySelector('.hdl-rate-widget').__hdlGoTo(10)
  Query: layout=1|0 (the switch) · offer=1|0 · film=1|0 · prac=0 (no practitioner name)
         save=ok|fail|wait (the answer to the final send)
         invite=<64 hex>&source=paid_stage1|practitioner&q=a..e (a personal link whose saved answers are all q)
-->
<div class="hdl-rate-widget" data-practitioner-id="206" data-api="https://harness.invalid/wp-json/hdl-v2/v1/widget/lead"></div>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  var on = function (k, d) { return (Q.get(k) || d) === '1'; };
  var name = Q.get('prac') === '0' ? '' : 'Rosa Example';
  if (name) document.querySelector('.hdl-rate-widget').setAttribute('data-practitioner-name', name);
  window.HDLW_GEO_URL = 'https://harness.invalid/geo';
  var page = function (band) { return 'https://harness.invalid/full-report-' + band; };
  var settings = Object.assign(
    { practitioner_name: name, logo_url: '', logo_shape: 'square', cta_link: '', cta_text: '', theme_color: '#3d8da0', access_mode: 'open', band_videos: {} },
    on('layout', '1') ? { result_one_column: true } : {},
    on('offer', '1') ? { result_offer: { today: '$27', video_url: '', band_urls: { green: page('slower'), blue: page('average'), red: page('faster') } } } : {},
    on('film', '1') ? { band_videos: { green: 'K2rQSjwvTws', blue: 'K2rQSjwvTws', red: 'K2rQSjwvTws' } } : {}
  );
  var letter = Q.get('q') || 'c', source = Q.get('source') || 'paid_stage1';
  var invite = Object.assign({}, settings, {
    valid: true, practitioner_id: 206, client_name: 'Ada Example', client_email: 'ada@example.test', source: source,
    api_url: 'https://harness.invalid/wp-json/hdl-v2/v1/widget/lead',
    prefill_stage1: { q1_age: 52, q1_sex: 'female', q2a: 2, q2b: 'even', q3: letter, q4: letter, q5: letter, q6: letter, q7: letter, q8: letter, q9: letter }
  });
  var answer = function (status, body, wait) {
    return new Promise(function (res) { setTimeout(function () { res({ ok: status < 400, status: status, json: function () { return Promise.resolve(body); } }); }, wait || 0); });
  };
  window.fetch = function (url, opts) {
    url = String(url);
    if (url.indexOf('/widget/public-config') >= 0) return answer(200, { config: settings });
    if (url.indexOf('/widget/verify-invite') >= 0) return answer(200, invite);
    if (url.indexOf('/widget/lead') >= 0 && opts && opts.method === 'POST') {
      var save = Q.get('save') || 'ok';
      if (save === 'wait') return new Promise(function () {});
      if (save === 'fail') return answer(500, { code: 'harness_refused', message: 'The harness refused this send.' }, 400);
      var made = 'harness'; // a practitioner's invite answers with the made-up link the page then shows
      return answer(200, source === 'practitioner' && Q.get('invite') ? { form_token: made } : { success: true }, 400);
    }
    return Promise.reject(new Error('the harness answers no other address'));
  };
})();
</script>
<script src="../../widget/hdl-lead-magnet.js"></script>
</body>
</html>
